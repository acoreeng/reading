<style>

function core(m){ return m.replace(/\s*\([^)]*\)/g,'').replace(/\[(.)\]\s*/g,'').replace(/\s+/g,' ').trim(); }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = m => esc(m).replace(/\[(.)\]/g,'<span class="ps">$1</span>');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const store = { get(k,d){ try { const v = localStorage.getItem("__PFX__"+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem("__PFX__"+k, JSON.stringify(v)); } catch(e){} } };
let stars = new Set(store.get('stars', []));
const saveStars = () => store.set('stars', [...stars]);
const main = document.getElementById('main');
const synth = window.speechSynthesis || null;
let voice = null, slow = store.get('slow', false);
function pickVoice(){ if (!synth) return; const vs = synth.getVoices(); voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft|Natural/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function say(t){
  if (!synth){ alertNoSound(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/~/g,' ').replace(/\s+/g,' ').trim());
  u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = slow ? 0.65 : 0.9; synth.speak(u);
}
function alertNoSound(){ const f = document.getElementById('fb') || main; const p = document.createElement('p'); p.className = 'nosound'; p.textContent = '이 브라우저에서는 음성 읽기를 지원하지 않습니다. 크롬이나 사파리에서 열어 주세요.'; f.appendChild(p); }
let actx = null;
function dingdong(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.02;
    [[1318.5, 0], [1046.5, 0.32]].forEach(([f, d]) => {
      [1, 2.01].forEach((m, k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f * m;
        const peak = k ? 0.06 : 0.28, st = t0 + d;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(peak, st + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.9);
        o.connect(g).connect(actx.destination); o.start(st); o.stop(st + 0.95);
      });
    });
  } catch(e) {}
}
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const spk = (t, cls='', label='') => `<button type="button" class="spk ${cls}" data-say="${esc(t)}" aria-label="${esc(t)} 발음 듣기">${ICON}${label}</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.preventDefault(); e.stopPropagation(); say(b.dataset.say); } }, true);
let scope = 'all'; // all | word | phrase | star
function pool(){ return W.filter(x => scope==='all' || (scope==='word' && !x.p) || (scope==='phrase' && x.p) || (scope==='star' && stars.has(x.i))); }
function scopeBar(extra=''){
  const opt = (v,l) => `<button class="pill" data-scope="${v}" aria-pressed="${scope===v}">${l}</button>`;
  return `<div class="tools">${opt('all','전체')}${opt('word','단어')}${opt('phrase','숙어')}${opt('star','★ 표시만')}<span class="sp"></span>${extra}</div>`;
}
function bindScope(fn){ main.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { scope = b.dataset.scope; fn(); }); }

/* 단어장 */
const normT = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[~.]/g,'').replace(/\s+/g,' ').trim();
let hideM = false, hideW = false, showTrace = store.get('trace', true);
const traceVals = {};
function list(){
  const p = pool();
  let h = scopeBar(`<button class="pill" id="hm" aria-pressed="${hideM}">뜻 가리기</button><button class="pill" id="hw" aria-pressed="${hideW}">영어 가리기</button>${hideM||hideW ? '<button class="pill" id="pa">정답 모두 확인</button>' : ''}<button class="pill" id="sl" aria-pressed="${slow}">천천히 읽기</button><button class="pill" id="tr" aria-pressed="${showTrace}">따라쓰기 칸</button><button class="pill" id="trc">따라쓰기 지우기</button>`);
  h += `<p class="count">${p.length}개 · ★를 누르면 헷갈리는 단어로 표시됩니다 · 뜻 아래 칸에 철자를 3번 따라 쓰세요${hideM||hideW ? ' · 줄을 누르면 가린 부분이 보입니다' : ''}</p>`;
  if (!p.length) h += `<p class="count">★ 표시한 단어가 아직 없습니다. 단어 오른쪽 ☆를 눌러 표시해 보세요.</p>`;
  let sec = '';
  p.forEach(x => {
    if (x.s !== sec){ if (sec) h += '</div>'; sec = x.s; h += `<h3>${esc(sec)}</h3><div class="list">`; }
    h += `<div class="item${x.p?' ph':''}" data-i="${x.i}"><span class="n">${x.i+1}</span><span class="w">${esc(x.w)}${spk(x.w)}</span><span class="m"><span class="txt">${fmt(x.m)}</span></span><button class="star" data-star="${x.i}" aria-pressed="${stars.has(x.i)}" aria-label="헷갈리는 단어 표시">${stars.has(x.i)?'★':'☆'}</button><div class="trace">${[0,1,2].map(j => { const v = traceVals[x.i+'_'+j] || ''; const st = v ? (normT(v)===normT(x.w) ? 'good' : (normT(x.w).startsWith(normT(v)) ? '' : 'bad')) : ''; return `<label><input data-tr="${x.i}_${j}" value="${esc(v)}" class="${st}" placeholder="${hideW ? (j+1)+'회' : esc(x.w)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${esc(x.w)} 따라쓰기 ${j+1}회"><span class="ck">${st==='good'?'✓':''}</span></label>`; }).join('')}</div></div>`;
  });
  if (sec) h += '</div>';
  main.innerHTML = h;
  bindScope(list);
  document.getElementById('hm').onclick = () => { hideM = !hideM; document.body.classList.toggle('hideM', hideM); list(); };
  document.getElementById('hw').onclick = () => { hideW = !hideW; document.body.classList.toggle('hideW', hideW); list(); };
  main.querySelectorAll('.item').forEach(r => r.onclick = e => { if (e.target.closest('.star') || e.target.closest('.trace')) return; r.classList.toggle('peek'); });
  document.body.classList.toggle('noTrace', !showTrace);
  document.getElementById('tr').onclick = () => { showTrace = !showTrace; store.set('trace', showTrace); list(); };
  document.getElementById('trc').onclick = () => { for (const k in traceVals) delete traceVals[k]; list(); };
  main.querySelectorAll('[data-tr]').forEach(inp => inp.oninput = () => {
    const [i] = inp.dataset.tr.split('_'), w = W[+i].w, v = inp.value, was = inp.classList.contains('good');
    traceVals[inp.dataset.tr] = v;
    const good = !!v.trim() && normT(v) === normT(w);
    inp.classList.toggle('good', good); inp.classList.toggle('bad', !!v.trim() && !good && !normT(w).startsWith(normT(v)));
    inp.nextElementSibling.textContent = good ? '✓' : '';
    if (good && !was){ dingdong(); const nx = inp.closest('label').nextElementSibling; if (nx) nx.querySelector('input').focus(); }
  });
  const pa = document.getElementById('pa'); if (pa) pa.onclick = () => { const items = [...main.querySelectorAll('.item')]; const all = items.every(i => i.classList.contains('peek')); items.forEach(i => i.classList.toggle('peek', !all)); pa.textContent = all ? '정답 모두 확인' : '다시 가리기'; };
  document.getElementById('sl').onclick = () => { slow = !slow; store.set('slow', slow); list(); };
  main.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const i = +b.dataset.star; stars.has(i) ? stars.delete(i) : stars.add(i); saveStars(); b.setAttribute('aria-pressed', stars.has(i)); b.textContent = stars.has(i)?'★':'☆'; });
}

/* 플래시카드 */
let deck = [], di = 0, flipped = false, front = 'en';
function cardStart(){ deck = shuffle(pool()); di = 0; flipped = false; card(); }
function card(){
  let h = scopeBar(`<button class="pill" id="fr" aria-pressed="${front==='ko'}">우리말 먼저</button><button class="pill" id="sh">다시 섞기</button>`);
  if (!deck.length){ main.innerHTML = h + `<p class="count">카드가 없습니다. ★ 표시한 단어가 없으면 '전체'를 고르세요.</p>`; bindCard(); return; }
  if (di >= deck.length){
    main.innerHTML = h + `<div class="card"><div class="big">끝!</div><div class="sub">${deck.length}장을 모두 넘겼습니다.<br>모르는 카드는 ★로 표시해 두었습니다.</div></div><div class="nav"><button id="again">처음부터</button></div>`;
    bindCard(); document.getElementById('again').onclick = cardStart; return;
  }
  const x = deck[di];
  const a = front==='en' ? `<div class="big">${esc(x.w)}</div>${spk(x.w,'big')}` : `<div class="sub" style="font-size:1.2rem;color:var(--ink)">${fmt(x.m)}</div>`;
  const b = front==='en' ? `<div class="sub">${fmt(x.m)}</div>` : `<div class="big" style="margin-top:12px">${esc(x.w)}</div>${spk(x.w,'big')}`;
  h += `<p class="count">${di+1} / ${deck.length}</p><div class="card" id="cd" tabindex="0">${a}${flipped ? b : '<div class="tip">카드를 누르면 답이 보입니다</div>'}</div>
  <div class="nav"><button id="pv">← 이전</button><button id="ck">${flipped ? '정답 가리기' : '정답 확인'}</button><button class="again" id="no">모르겠어요 ★</button><button class="know" id="yes">알아요</button></div>
  <div class="prog"><i style="width:${(di/deck.length*100).toFixed(1)}%"></i></div>`;
  main.innerHTML = h; bindCard();
  const cd = document.getElementById('cd');
  cd.onclick = () => { flipped = !flipped; card(); };
  cd.onkeydown = e => { if (e.key===' '||e.key==='Enter'){ e.preventDefault(); cd.click(); } };
  document.getElementById('pv').onclick = () => { if (di>0){ di--; flipped=false; card(); } };
  document.getElementById('ck').onclick = () => { flipped = !flipped; card(); if (flipped && front==='ko') say(x.w); };
  document.getElementById('yes').onclick = () => { stars.delete(x.i); saveStars(); di++; flipped=false; card(); };
  document.getElementById('no').onclick = () => { stars.add(x.i); saveStars(); di++; flipped=false; card(); };
}
function bindCard(){
  bindScope(cardStart);
  const fr = document.getElementById('fr'); if (fr) fr.onclick = () => { front = front==='en'?'ko':'en'; flipped=false; card(); };
  const sh = document.getElementById('sh'); if (sh) sh.onclick = cardStart;
}

document.addEventListener('click', e => { if (e.target.id === 're'){ ({quiz:quizStart, ee:eeStart, spell:spellStart})[mode](); } });

/* 철자 쓰기 */

  if (si >= ss.length){ main.innerHTML = h + result(ss.length, sr, smiss.map(x => `<b>${esc(x.w)}</b> ${fmt(x.m)}`)); bindScope(spellStart); return; }
  const x = ss[si];

  h += `<div class="score"><span>문제 <b>${si+1}</b> / ${ss.length}</span><span>맞힘 <b>${sr}</b></span></div>

    document.querySelector('#nx button').focus();
  };
}

/* 셀프 테스트 · 실전 테스트 */
let T = null, TS = null, TR = null, tName = store.get('tname', '');
const firstHint = w => w.replace(/[A-Za-z]/g, (c,k) => (k===0 || w[k-1]===' ') ? c : '_');
const normEn = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[~.]/g,'').replace(/\s+/g,' ').trim();
const mcWord = x => ({ t:'en2ko', x, opts: shuffle([x, ...shuffle(W.filter(y => y.i!==x.i && y.p===x.p)).slice(0,3)]) });
const mcDef = e => ({ t:'def', x:e, opts: shuffle([e, ...shuffle(E.filter(y => y.w!==e.w)).slice(0,3)]) });
const ALL = W.length + E.length;
function testStart(kind){
  kind = kind || (T && T.kind) || 'mcall';
